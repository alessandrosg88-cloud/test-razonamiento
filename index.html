<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test de Razonamiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: una sola columna centrada tipo "hoja de examen", una pregunta por pantalla */
:root{
  --bg:#eef1f5; --paper:#ffffff; --ink:#152033; --muted:#5a6578; --line:#d5dbe5;
  --accent:#2f5bea; --accent-soft:#e3e9fd; --ok:#1d8a5b; --ok-soft:#dff3ea; --bad:#c23b3b; --bad-soft:#fae3e3;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141d; --paper:#171e2a; --ink:#e6ebf3; --muted:#97a2b5; --line:#2a3445;
  --accent:#7b9bff; --accent-soft:#1f2a47; --ok:#4cc58f; --ok-soft:#163327; --bad:#f07a7a; --bad-soft:#3a1d1f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141d; --paper:#171e2a; --ink:#e6ebf3; --muted:#97a2b5; --line:#2a3445;
  --accent:#7b9bff; --accent-soft:#1f2a47; --ok:#4cc58f; --ok-soft:#163327; --bad:#f07a7a; --bad-soft:#3a1d1f; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;padding:0 16px}
.wrap{max-width:640px;margin:0 auto;padding-block:40px 64px;display:flex;flex-direction:column;gap:24px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:clamp(1.8rem,5vw,2.4rem);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
.meta{font-family:var(--mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:28px}
.lead{color:var(--muted);margin:0;max-width:60ch}
.rules{margin:0;padding-left:1.2em;display:grid;gap:6px}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.qhead{display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.q{font-family:var(--display);font-weight:500;font-size:1.35rem;line-height:1.3;margin:12px 0 20px;text-wrap:balance}
.seq{font-family:var(--mono);background:var(--accent-soft);padding:2px 8px;border-radius:6px;white-space:nowrap}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:460px){.opts{grid-template-columns:1fr}}
.opt{font:inherit;text-align:left;padding:14px 16px;border:1.5px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);cursor:pointer;display:flex;gap:12px;align-items:center;min-width:0}
.opt:hover{border-color:var(--accent)}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt b{font-family:var(--mono);font-size:.8rem;color:var(--muted);flex:none}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px}
.btn{font:inherit;font-weight:600;padding:12px 22px;border-radius:10px;border:1.5px solid var(--accent);background:var(--accent);color:var(--paper);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.score{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end}
.big{font-family:var(--display);font-weight:700;font-size:4.5rem;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.lbl{font-family:var(--mono);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stat{font-family:var(--display);font-size:1.6rem;font-weight:500;font-variant-numeric:tabular-nums}
.scale{position:relative;height:44px;margin-top:20px}
.scale .track{position:absolute;top:10px;left:0;right:0;height:8px;border-radius:99px;background:linear-gradient(90deg,var(--line),var(--accent-soft) 40%,var(--accent-soft) 60%,var(--line))}
.scale .pin{position:absolute;top:2px;width:4px;height:24px;background:var(--accent);border-radius:2px;transform:translateX(-50%)}
.scale .ticks{position:absolute;top:26px;left:0;right:0;font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.scale .ticks span{position:absolute;transform:translateX(-50%)}
.note{font-size:.88rem;color:var(--muted);margin:0}
.review{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.review li{padding:12px 14px;border-radius:10px;display:grid;gap:2px;font-size:.92rem}
.review li.ok{background:var(--ok-soft)} .review li.ko{background:var(--bad-soft)}
.review .t{font-weight:600}
.review .r{font-family:var(--mono);font-size:.78rem}
.review li.ok .r{color:var(--ok)} .review li.ko .r{color:var(--bad)}
h2{font-family:var(--display);font-weight:500;font-size:1.2rem;margin:0}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>
<style>
.langs{display:flex;gap:6px;flex-wrap:wrap}
.lang{font:inherit;font-family:var(--mono);font-size:.78rem;padding:6px 10px;border-radius:8px;border:1.5px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.lang[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="langs" role="group" aria-label="Language">
      <button class="lang" data-l="es">ES</button>
      <button class="lang" data-l="it">IT</button>
      <button class="lang" data-l="en">EN</button>
      <button class="lang" data-l="ne">नेपाली</button>
    </div>
    <span class="meta" id="timer">00:00</span>
  </div>
  <header><h1 id="title"></h1></header>

  <section class="card" id="intro" style="display:grid;gap:16px">
    <p class="lead" id="lead"></p>
    <ul class="rules" id="rules"></ul>
    <div><button class="btn" id="start"></button></div>
  </section>

  <section id="quiz" hidden style="display:grid;gap:16px">
    <div class="bar"><i id="prog"></i></div>
    <div class="card">
      <div class="qhead"><span id="qnum"></span><span id="qcat"></span></div>
      <p class="q" id="qtext"></p>
      <div class="opts" id="opts"></div>
      <div class="nav">
        <button class="btn ghost" id="prev"></button>
        <button class="btn" id="next"></button>
      </div>
    </div>
  </section>

  <section id="result" hidden style="display:grid;gap:16px">
    <div class="card" style="display:grid;gap:16px">
      <div class="score">
        <div><div class="lbl" id="l_iq"></div><div class="big" id="iq">—</div></div>
        <div><div class="lbl" id="l_hits"></div><div class="stat" id="hits"></div></div>
        <div><div class="lbl" id="l_time"></div><div class="stat" id="time"></div></div>
      </div>
      <div class="scale">
        <div class="track"></div>
        <div class="pin" id="pin"></div>
        <div class="ticks"><span style="left:0%">70</span><span style="left:20%">85</span><span style="left:40%">100</span><span style="left:60%">115</span><span style="left:80%">130</span><span style="left:100%">145</span></div>
      </div>
      <p class="note" id="band"></p>
      <p class="note" id="disc"></p>
      <div><button class="btn ghost" id="again"></button></div>
    </div>
    <div class="card" style="display:grid;gap:14px">
      <h2 id="l_sol"></h2>
      <ul class="review" id="review"></ul>
    </div>
  </section>
</div>

  e:{es:"El “hoy” hipotético está dos días antes del real: viernes + 2 = domingo.",it:"L'“oggi” ipotetico è due giorni prima di quello reale: venerdì + 2 = domenica.",en:"The hypothetical “today” is two days before the real one: Friday + 2 = Sunday.",ne:"काल्पनिक “आज” वास्तविक आजभन्दा दुई दिन अघि हो: शुक्रबार + २ = आइतबार।"}},

  e:{es:"Un día antes de cubrirlo entero: día 47.",it:"Il giorno prima di coprirlo tutto: giorno 47.",en:"One day before it's fully covered: day 47.",ne:"पूरै ढाक्नुभन्दा एक दिन अघि: 47 औँ दिन।"}},
 {c:"prob",o:["8","10","12","15"],a:1,

 {c:"prob",o:["11:00","11:30","12:00","13:00"],a:2,

 {c:"space",a:1,

  q:{es:"Miras al norte, giras 90° a la derecha, luego 180°, luego 90° a la izquierda. ¿Hacia dónde miras?",it:"Guardi a nord, giri di 90° a destra, poi di 180°, poi di 90° a sinistra. Dove guardi?",en:"You face north, turn 90° right, then 180°, then 90° left. Which way are you facing?",ne:"तपाईं उत्तर फर्कनुहुन्छ, 90° दायाँ घुम्नुहुन्छ, त्यसपछि 180°, अनि 90° बायाँ। अब कता फर्कनुभएको छ?"},

 {c:"odd",o:["16","25","48","64"],a:2,
  q:{es:"¿Qué número no encaja? "+S("16, 25, 36, 48, 64"),it:"Quale numero non c'entra? "+S("16, 25, 36, 48, 64"),en:"Which number doesn't fit? "+S("16, 25, 36, 48, 64"),ne:"कुन सङ्ख्या मेल खाँदैन? "+S("16, 25, 36, 48, 64")},
  e:{es:"Todos son cuadrados perfectos menos 48.",it:"Sono tutti quadrati perfetti tranne 48.",en:"All are perfect squares except 48.",ne:"48 बाहेक सबै पूर्ण वर्ग हुन्।"}}
];
const $=id=>document.getElementById(id);
let L="es";
try{const s=localStorage.getItem("lang");if(s&&UI[s])L=s;else{const n=(navigator.language||"").slice(0,2);if(UI[n])L=n;}}catch(e){}
let i=0,ans=Array(Q.length).fill(null),t0=0,tick=null,elapsed=0,cur="intro";
const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
const opts=q=>Array.isArray(q.o)?q.o:q.o[L];
function show(sec){cur=sec;["intro","quiz","result"].forEach(k=>{const el=$(k);el.hidden=k!==sec;el.style.display=k===sec?"grid":"none"});}
function applyLang(){
  const u=UI[L];document.documentElement.lang=L;document.title=u.title;
  document.querySelectorAll(".lang").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===L));
  $("title").textContent=u.title;$("lead").textContent=u.lead;$("rules").innerHTML=u.rules.map(r=>`<li>${r}</li>`).join("");
  $("start").textContent=u.start;$("prev").textContent=u.prev;$("again").textContent=u.again;
  $("l_iq").textContent=u.iq;$("l_hits").textContent=u.hits;$("l_time").textContent=u.time;$("l_sol").textContent=u.sol;$("disc").textContent=u.disc;
  if(cur==="quiz")render();if(cur==="result")results();
}
function render(){
  const q=Q[i],u=UI[L];
  $("qnum").textContent=u.q(i+1,Q.length);$("qcat").textContent=CAT[q.c][L];$("qtext").innerHTML=q.q[L];
  $("prog").style.width=(i/Q.length*100)+"%";
  const box=$("opts");box.innerHTML="";
  opts(q).forEach((t,k)=>{const b=document.createElement("button");b.className="opt"+(ans[i]===k?" sel":"");b.id="opt"+k;
    b.innerHTML=`<b>${"ABCD"[k]}</b><span>${t}</span>`;b.onclick=()=>{ans[i]=k;render();};box.appendChild(b);});
  $("prev").disabled=i===0;$("next").textContent=i===Q.length-1?u.finish:u.next;$("next").disabled=ans[i]===null;
}
function start(){i=0;ans=Array(Q.length).fill(null);t0=Date.now();clearInterval(tick);
  tick=setInterval(()=>{elapsed=Math.floor((Date.now()-t0)/1000);$("timer").textContent=fmt(elapsed)},1000);
  $("timer").textContent="00:00";show("quiz");render();}
function results(){
  const u=UI[L],hits=ans.filter((a,k)=>a===Q[k].a).length;
  let iq=70+hits*3.75;if(hits>=15&&elapsed<600)iq+=3;iq=Math.round(Math.min(145,iq));
  $("iq").textContent=iq;$("hits").textContent=`${hits}/${Q.length}`;$("time").textContent=fmt(elapsed);
  $("pin").style.left=Math.max(0,Math.min(100,(iq-70)/75*100))+"%";
  $("band").textContent=u.bands[iq>=130?0:iq>=115?1:iq>=85?2:3];
  $("review").innerHTML=Q.map((q,k)=>{const ok=ans[k]===q.a,o=opts(q);
    return `<li class="${ok?"ok":"ko"}"><span class="t">${k+1}. ${q.q[L].replace(/<[^>]+>/g,"")}</span>
    <span class="r">${ok?u.ok:u.yours+": "+o[ans[k]]+" · "+u.right+": "+o[q.a]}</span><span>${q.e[L]}</span></li>`}).join("");
}
function finish(){clearInterval(tick);elapsed=Math.floor((Date.now()-t0)/1000);results();show("result");window.scrollTo(0,0);}
document.querySelectorAll(".lang").forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem("lang",L)}catch(e){}applyLang();});
$("start").onclick=start;$("again").onclick=start;
$("prev").onclick=()=>{if(i>0){i--;render();}};
$("next").onclick=()=>{if(ans[i]===null)return;if(i<Q.length-1){i++;render();}else finish();};
show("intro");applyLang();
</script>
</body>
</html>
